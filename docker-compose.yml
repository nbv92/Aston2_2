services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - ms-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      # внутри docker-сети сервисы ходят на kafka:9092
      - "9092:9092"
    environment:
      # KRaft mode (без ZooKeeper)
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # listeners
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # misc
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - ms-net

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-server
      SERVER_PORT: "8888"

      # проще всего в docker: native backend + volume с конфигами
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/config"
    volumes:
      - ./config-repo:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - ms-net

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: discovery-server
      SERVER_PORT: "8761"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40
    networks:
      - ms-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
        interval: 5s
        timeout: 3s
        retries: 40
        networks:
          - ms-net

        user-service:
          build:
            context: ./user-service
            dockerfile: Dockerfile
          container_name: user-service
          depends_on:
            postgres:
              condition: service_healthy
            kafka:
              condition: service_healthy
            discovery-server:
              condition: service_healthy
            config-server:
              condition: service_healthy
          environment:
            SPRING_APPLICATION_NAME: user-service
            SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka"
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

            SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/userdb"
            SPRING_DATASOURCE_USERNAME: "user"
            SPRING_DATASOURCE_PASSWORD: "password"

            SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          # порт можно не публиковать наружу: доступ через gateway
          # ports:
          #   - "8081:8081"
          networks:
            - ms-net

        notification-service:
          build:
            context: ./notification-service
            dockerfile: Dockerfile
          container_name: notification-service
          depends_on:
            kafka:
              condition: service_healthy
            discovery-server:
              condition: service_healthy
            config-server:
              condition: service_healthy
          environment:
            SPRING_APPLICATION_NAME: notification-service
            SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka"
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

            SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
          networks:
            - ms-net

      networks:
        ms-net:

      volumes:
        pgdata:
        kafkadata: